import java.util.Properties

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def uploadSigning = new Properties()
def uploadSigningFile = rootProject.file('key.properties')
if (uploadSigningFile.exists()) {
    uploadSigningFile.withInputStream { uploadSigning.load(it) }
}
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') } && !uploadSigningFile.exists()) {
    throw new GradleException('Production signing is missing. Configure the ignored android/key.properties file; see docs/SUPABASE_SETUP_AND_CUTOVER.md.')
}

android {
    namespace = "com.noted.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.noted.app"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (uploadSigningFile.exists()) {
                storeFile = file(uploadSigning.getProperty('storeFile'))
                storePassword = uploadSigning.getProperty('storePassword')
                keyAlias = uploadSigning.getProperty('keyAlias')
                keyPassword = uploadSigning.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}
