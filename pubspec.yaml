name: noted
description: "A peaceful space for personal and business notes."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.0
  crypto: ^3.0.6
  intl: ^0.20.2
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  local_auth: ^3.0.0
  share_plus: ^12.0.0
  path_provider: ^2.1.5
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.0
  record: ^6.1.0
  audioplayers: ^6.5.0
  flutter_svg: ^2.2.0
  flutter_quill: ^11.5.0
  markdown: ^7.3.1
  flutter_quill_delta_from_html: ^1.5.3
  dart_quill_delta: ^10.8.3

dev_dependencies:
  http: ^1.6.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - docs/Logo.png
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans.ttf
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-Italic.ttf
          style: italic
