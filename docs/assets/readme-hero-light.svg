    <path d="M28 43h106M28 71h158" stroke="#4F7E6C" stroke-width="8" stroke-linecap="round" opacity=".45"/>
  </g>
  <g transform="translate(867 135) rotate(-2 128 150)">
    <rect width="256" height="300" rx="21" fill="#FFFFFF" stroke="#E4E0D7" stroke-width="2"/>
    <text x="27" y="45" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#6F6F6F">LITTLE BY LITTLE</text>
    <text x="27" y="96" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="30" fill="#2F2F2F">Something good</text>
    <text x="27" y="132" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="30" fill="#2F2F2F">starts here.</text>
    <g fill="none" stroke="#4F7E6C" stroke-width="2">
