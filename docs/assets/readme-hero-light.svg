    <path d="M55 176h117M55 209h90" stroke="#D9DDD6" stroke-width="7" stroke-linecap="round"/>
    <circle cx="35" cy="263" r="6" fill="#4F7E6C"/>
    <text x="50" y="268" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6F6F6F">Room for what matters.</text>
