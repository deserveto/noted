    <text x="27" y="45" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#A3A89F">LITTLE BY LITTLE</text>
    <text x="27" y="96" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="30" fill="#F1EEE4">Something good</text>
    <text x="27" y="132" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="30" fill="#F1EEE4">starts here.</text>
